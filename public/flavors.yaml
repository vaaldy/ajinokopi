# Coffee flavor wheel data — edit freely, reload the page to see changes.
# Two levels: Category -> notes. List order = wheel order (put your "intensity
# axis" into the ordering, e.g. sweet-tart oranges first, sharp citric last).
#
#   color       base hue for the family arc (tier 1)
#   notes       the family's notes, in wheel order (tier 2)
#   noteColors  optional per-note colour so each note reads as its own
#               real-world colour; notes left out fall back to a shade of
#               `color`
#   groups      optional split of `notes` into concentric radial bands, e.g.
#               [3, 3, 5] = nuts / cocoa / spice inside one family
#
# Ring position is NOT this file's order: families are seated by "power" (note
# count) so the big ones land top/bottom where a portrait screen has headroom.

Floral:
  color: "#f0e7dc"
  notes: [jasmine, orange blossom, coffee blossom, rose, chamomile, lavender, hibiscus]
  noteColors:
    jasmine: "#f5f0e6"
    orange blossom: "#f8d3a8"
    coffee blossom: "#f6dcd2"
    rose: "#f3bcc8"
    chamomile: "#f7e9b0"
    lavender: "#cfc3e8"
    hibiscus: "#e8a3b8"

